# DeveloperOS production stack: PostgreSQL 18 + one-shot migrations + API.
#
#   cd developeros-backend
#   node scripts/generate-secrets.js > deploy/.env.production   # then edit
#   docker compose -f deploy/compose.yaml --env-file deploy/.env.production up -d --build
#
# Credential separation (EF-3):
#   db       holds the owner/superuser password (POSTGRES_OWNER_PASSWORD).
#   migrate  receives the owner URL + the runtime URL (it creates the runtime
#            role on first run and re-applies its grants on every run).
#   app      receives ONLY the runtime URL; it never sees owner credentials.
# The database port is not published; only the app port is, on loopback by
# default, for a TLS-terminating reverse proxy on the same host.
name: ${COMPOSE_PROJECT_NAME:-developeros}

x-app-image: &app-image
  image: ${DEVOS_APP_IMAGE:-developeros:local}
  build:
    context: ..
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-developeros}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-devos_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in the env file}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      # postgres:18 images keep PGDATA under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  migrate:
    <<: *app-image
    command: ["npm", "run", "--silent", "db:migrate"]
    restart: "no"
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER:-devos_owner}:${POSTGRES_OWNER_PASSWORD:?}@db:5432/${POSTGRES_DB:-developeros}
      DATABASE_URL: postgresql://${DEVOS_RUNTIME_USER:-devos_app}:${DEVOS_RUNTIME_PASSWORD:?set DEVOS_RUNTIME_PASSWORD in the env file}@db:5432/${POSTGRES_DB:-developeros}
      # true: also (re)set the runtime role's password from DATABASE_URL (rotation)
      DEVOS_SYNC_RUNTIME_PASSWORD: ${DEVOS_SYNC_RUNTIME_PASSWORD:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      disable: true

  app:
    <<: *app-image
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${DEVOS_RUNTIME_USER:-devos_app}:${DEVOS_RUNTIME_PASSWORD:?}@db:5432/${POSTGRES_DB:-developeros}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:?set AUDIT_SIGNING_KEY in the env file}
      AUDIT_TRUSTED_PUBLIC_KEYS: ${AUDIT_TRUSTED_PUBLIC_KEYS:-}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL (public https origin) in the env file}
      # reverse-proxy hops in front of the app (1 = one TLS proxy); empty if exposed directly
      TRUST_PROXY: ${TRUST_PROXY-1}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-1000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      # Email (invitations, password reset). Enabled only when SMTP_HOST, MAIL_FROM and APP_BASE_URL are set;
      # otherwise administrators share invitation links and self-service reset is hidden.
      APP_BASE_URL: ${APP_BASE_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "${DEVOS_HTTP_BIND:-127.0.0.1}:${DEVOS_HTTP_PORT:-3000}:3000"
    volumes:
      - applogs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata: {}
  applogs: {}
